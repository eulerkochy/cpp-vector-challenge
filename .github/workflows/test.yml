# Runs your stage tests on every push: edit include/my/vector.hpp, push, read the result.
#
# `.cppatlas.json` says which stage you are on. CI runs stages 1..<that stage>
# with `./cppatlas test <stage>`, so a push is green when your current stage
# (and every earlier one) passes under GCC 16.2 and Clang 21 (C++23), with and
# without AddressSanitizer + UndefinedBehaviorSanitizer. `./cppatlas test`
# advances `.cppatlas.json` locally when a stage passes: commit that file and
# the next push is graded on the next stage.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the still-running older run for the same ref.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stages:
    name: ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Same compilers as the dev container: GCC 16.2 (`g++`, from the
        # gcc:16.2 image) and Clang 21 (apt.llvm.org). The job builds
        # .devcontainer/Dockerfile and runs ./cppatlas inside it, so CI and
        # the learner's container are the same environment.
        compiler: [g++, clang++-21]
        preset: [debug, asan-ubsan]
    steps:
      # Actions are pinned to major versions for readability. For stricter
      # supply-chain hygiene, pin each to a full commit SHA instead
      # (e.g. actions/checkout@<sha> # v4) and let Dependabot update them.
      - uses: actions/checkout@v4

      - name: Read the current stage from .cppatlas.json
        id: stage
        shell: bash
        run: |
          if [ ! -f .cppatlas.json ]; then
            echo "::error file=.cppatlas.json::.cppatlas.json is missing. Restore it (git checkout .cppatlas.json) or create it: {\"challenge\":\"vector\",\"stage\":1}"
            exit 1
          fi
          stage="$(tr -d ' \t\r\n' < .cppatlas.json | sed -n 's/.*"stage":\([0-9][0-9]*\)[,}].*/\1/p')"
          if [ -z "$stage" ] || [ "$stage" -lt 1 ] || [ "$stage" -gt 8 ]; then
            echo "::error file=.cppatlas.json::\"stage\" must be a number from 1 to 8 (found: '${stage:-none}')"
            exit 1
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "Grading stages 1..$stage"

      - name: Build the dev container image
        run: docker build -t cppatlas-vector-dev -f .devcontainer/Dockerfile .devcontainer

      - name: Toolchain versions
        run: |
          docker run --rm cppatlas-vector-dev bash -c \
            'g++ --version | head -n 1; clang++-21 --version | head -n 1; cmake --version | head -n 1'

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.compiler }}-${{ matrix.preset }}-${{ hashFiles('include/**', 'tests/**', 'CMakeLists.txt', 'cmake/**', '.devcontainer/Dockerfile') }}
          restore-keys: |
            ccache-${{ matrix.compiler }}-${{ matrix.preset }}-

      # Runs stages 1..<current stage>, stopping at the first failure; its exit
      # code fails this step (and job). An explicit stage number never advances
      # .cppatlas.json.
      - name: ./cppatlas test ${{ steps.stage.outputs.stage }} --preset ${{ matrix.preset }}
        # `shell: bash` (not the default) enables pipefail, so a failing stage
        # still fails the step even though its output goes through tee.
        shell: bash
        # The container runs as the runner's uid so build/ and .ccache stay
        # writable; ptrace + unconfined seccomp are needed by ASan/LSan.
        run: |
          mkdir -p .ccache
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --cap-add=SYS_PTRACE --security-opt seccomp=unconfined \
            -e HOME=/tmp -e NO_COLOR=1 -e CXX="${{ matrix.compiler }}" \
            -e CCACHE_DIR=/workspace/.ccache -e CCACHE_COMPRESS=1 -e CCACHE_MAXSIZE=200M \
            -v "$PWD:/workspace" -w /workspace \
            cppatlas-vector-dev \
            ./cppatlas test "${{ steps.stage.outputs.stage }}" --preset "${{ matrix.preset }}" 2>&1 | tee cppatlas-output.txt

      - name: Progress summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ matrix.compiler }} / ${{ matrix.preset }}"
            echo
            stage="${{ steps.stage.outputs.stage }}"
            if grep -qE '^stage [0-9]+ ✗' cppatlas-output.txt 2>/dev/null; then
              echo "**Stage $stage is not passing yet.** Red is expected until it does."
            elif grep -q '^All [0-9]* stages' cppatlas-output.txt 2>/dev/null; then
              echo "**$(grep '^All [0-9]* stages' cppatlas-output.txt)**"
            elif [ -s cppatlas-output.txt ]; then
              echo "**Stages 1..$stage pass.** Run ./cppatlas test locally to advance."
            else
              echo "Stage $stage did not run; see the log."
            fi
            echo
            echo '```'
            grep -E '^stage [0-9]+ ' cppatlas-output.txt 2>/dev/null || echo "(no stage ran; see the log)"
            grep -E '^next:' cppatlas-output.txt 2>/dev/null || true
            echo '```'
            echo
            echo "Stage list:"
            echo '```'
            ./cppatlas stages
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
